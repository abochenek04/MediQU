# Import deliberately as a NEW production service only after production acceptance.
services:
  - type: web
    name: mediq-production
    runtime: node
    branch: main
    plan: starter
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci && VITE_DATA_MODE=backend VITE_APP_ENV=production npm run build:production
    startCommand: npm run api
    healthCheckPath: /api/health
    disk:
      name: mediq-production-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: APP_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/mediq.sqlite
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_STATIC
        value: "true"
      - key: RUN_JOBS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: MAIL_MODE
        value: resend
      - key: MAIL_DAILY_LIMIT
        value: "100"
      - key: MAIL_MONTHLY_LIMIT
        value: "1000"
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
